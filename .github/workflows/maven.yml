name: End-to-End Functional and Validation Web/UI Tests

on:
  schedule:
    # Runs at 3:30 AM UTC, which is 9:00 AM IST
    # Monday to Friday
    - cron: '30 3 * * 1-5'
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Install Chrome Browser
        run: |
          echo "Installing Chrome and dependencies..."
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          echo "Chrome installed at: $(which google-chrome)"
          echo "Chrome version: $(google-chrome --version)"
      
      - name: Build with Maven (Download Dependencies)
        run: |
          echo "Building project and downloading dependencies..."
          mvn clean install -DskipTests -q
      
      - name: Create Maven settings security file
        run: |
          mkdir -p ~/.m2
          echo '<settingsSecurity><master>ignored</master></settingsSecurity>' > ~/.m2/settings-security.xml
      
      - name: Debug - Check test suite and classes
        run: |
          echo "========================================"
          echo "Checking TestSuite configuration..."
          echo "========================================"
          echo "TestSuite1.xml location:"
          ls -la src/test/resources/TestSuites/TestSuite1.xml || echo "❌ TestSuite1.xml NOT FOUND"
          echo ""
          echo "Test classes:"
          find src/test/java/tests -name "*.java" -type f || echo "❌ No test classes found"
          echo ""
          echo "Compiled test classes:"
          find target/test-classes/tests -name "*.class" -type f || echo "⚠️  No compiled test classes found"
          echo "========================================"
      
      - name: Run TestNG End to End Functional Tests
        run: |
          echo "🚀 Starting Tests with Headless Chrome..."
          echo "Browser: Chrome (Headless Mode)"
          echo "Chrome Binary: /usr/bin/google-chrome"
          echo "Test Profile: All"
          echo ""
          mvn test \
            -Dbrowser="Chrome" \
            -DchromeBinary="/usr/bin/google-chrome" \
            -PAll \
            -DfailIfNoTests=true \
            -X 2>&1 | tail -100
      
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn
      
      - name: Upload chromedriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromedriver-log
          path: chromedriver.log
          if-no-files-found: warn
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-test-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Publish Test Report Summary
        if: always()
        run: |
          echo "✅ Test execution completed"
          echo "📊 Reports available in artifacts"
          echo ""
          if [ -d "target/surefire-reports" ]; then
            echo "Test Results Found:"
            find target/surefire-reports -name "*.xml" -type f | head -5
          else
            echo "⚠️  No surefire reports directory found"
          fi
